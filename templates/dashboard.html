<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mpofu Enterprise - Live Operations ERP</title>
    <style>
        body { background-color: #030712; color: #f3f4f6; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        header { background-color: #111827; border-bottom: 1px solid #1f2937; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #3b82f6; margin: 0; font-size: 24px; }
        
        /* New Live Inventory Warehouse Ticker Styling */
        .inventory-banner { display: flex; gap: 20px; padding: 15px 40px; background-color: #0f172a; border-bottom: 1px solid #334155; overflow-x: auto; font-family: monospace; }
        .inv-pill { background-color: #1e293b; border: 1px solid #475569; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; display: flex; gap: 10px; align-items: center; }
        .inv-pill.warning { border-color: #f97316; color: #f97316; animation: pulse 2s infinite; }
        .inv-pill.critical { border-color: #ef4444; color: #ef4444; background-color: rgba(239, 68, 68, 0.1); animation: blink 1s infinite; }
        
        .main-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; padding: 30px; max-width: 1600px; margin: 0 auto; }
        section { background-color: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 24px; }
        .order-card { background-color: #111827; border: 1px solid #374151; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .transit-timer-box { background-color: #1e293b; border: 1px solid #334155; padding: 8px; border-radius: 6px; font-family: monospace; color: #60a5fa; display: flex; justify-content: space-between; margin-top: 10px; }
        .action-btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-kitchen { background-color: #ea580c; }
        .btn-dispatch { background-color: #2563eb; }
        .btn-complete { background-color: #059669; }
        .revenue-display { background-color: #111827; border: 1px solid #374151; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 24px; }
        .revenue-display h3 { margin: 0; font-size: 32px; color: #10b981; font-family: monospace; }
        .ledger-row { background-color: #111827; border: 1px solid #1f2937; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; font-family: monospace; font-size: 12px; margin-bottom: 8px; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        @keyframes blink { 0%, 100% { border-color: #ef4444; } 50% { border-color: transparent; } }
    </style>
</head>
<body>
    <header>
        <div><h1>MPOFU ENTERPRISE RESTAURANT</h1></div>
        <div style="color: #10b981; font-family: monospace;">● SERVER ONLINE</div>
    </header>

    <!-- Visual Stock Alert Bar Component -->
    <div class="inventory-banner" id="live-inventory-bar">
        <div style="color: #64748b; font-size: 13px;">Syncing stock depletion levels...</div>
    </div>

    <div class="main-container">
        <section>
            <h2 style="color: #f97316; border-bottom: 1px solid #374151; padding-bottom: 10px;" id="kitchen-count">🍳 KITCHEN PREPARATION (0)</h2>
            <div id="kitchen-cards-container"></div>
        </section>
        <section>
            <h2 style="color: #3b82f6; border-bottom: 1px solid #374151; padding-bottom: 10px;">🚚 COURIER DISPATCH DESK</h2>
            <div id="dispatch-cards-container"></div>
        </section>
        <section>
            <h2 style="color: #10b981; border-bottom: 1px solid #374151; padding-bottom: 10px;">📊 FINANCIAL LEDGER</h2>
            <div class="revenue-display"><p style="margin:0 0 5px 0; color:#9ca3af; font-size:12px;">GROSS REVENUE</p><h3 id="gross-revenue">$0.00</h3></div>
            <div id="admin-ledger-container"></div>
        </section>
    </div>

    <script>
        const transitTrackers = {};
        async function fetchSystemData() {
            try {
                // 1. Pull dynamic transaction ledger lines
                const response = await fetch('/admin/dashboard/transactions?username=admin');
                const data = await response.json();

                // 2. Fetch raw ingredient quantities side-by-side (Parallel Data Sync)
                const invResponse = await fetch('/inventory/status');
                const invData = await invResponse.json();

                // Render Live Stock Tracker Pill Badges
                const invBar = document.getElementById('live-inventory-bar');
                if (invBar && invData) {
                    invBar.innerHTML = "";
                    for (const [ingredient, qty] of Object.entries(invData)) {
                        const pill = document.createElement('div');
                        let badgeClass = "inv-pill";
                        let statusTxt = `QTY: ${qty}`;
                        
                        if (qty === 0) {
                            badgeClass += " critical";
                            statusTxt = "❌ OUT OF STOCK";
                        } else if (qty <= 5) {
                            badgeClass += " warning";
                            statusTxt = "⚠️ LOW STOCK";
                        }
                        
                        pill.className = badgeClass;
                        pill.innerHTML = `<span>${ingredient.toUpperCase()}</span> <span style="font-family:sans-serif; opacity:0.8;">|</span> <span>${statusTxt}</span>`;
                        invBar.appendChild(pill);
                    }
                }
                
                if (data && data.detailed_ledger) {
                    document.getElementById('gross-revenue').innerText = data.gross_system_revenue;
                    const kitchenContainer = document.getElementById('kitchen-cards-container');
                    const dispatchContainer = document.getElementById('dispatch-cards-container');
                    const ledgerContainer = document.getElementById('admin-ledger-container');
                    kitchenContainer.innerHTML = ""; dispatchContainer.innerHTML = ""; ledgerContainer.innerHTML = "";
                    let kitchenCount = 0;

                    data.detailed_ledger.forEach(order => {
                        const logRow = document.createElement('div');
                        logRow.className = "ledger-row";
                        logRow.innerHTML = `<div><span style="color:#3b82f6;">${order.receipt_id}</span> | ${order.client_name}</div><div style="color:#10b981;">$${order.total_bill.toFixed(2)}</div>`;
                        ledgerContainer.appendChild(logRow);

                        if (order.status === "pending" || order.status === "in_kitchen") {
                            kitchenCount++;
                            const card = document.createElement('div');
                            card.className = "order-card";
                            card.innerHTML = `<strong>${order.receipt_id}</strong> [${order.order_type}]<h3>${order.client_name}</h3><p style="color:#9ca3af; font-size:13px;">${order.items_summary}</p><button onclick="advanceOrderStatus('${order.receipt_id}', 'ready_for_dispatch')" class="action-btn btn-kitchen">Mark Food Ready</button>`;
                            kitchenContainer.appendChild(card);
                        }
                        if (order.status === "ready_for_dispatch" || order.status === "out_for_delivery") {
                            const card = document.createElement('div');
                            card.className = "order-card";
                            let btnHtml = ""; let trackerHtml = "";
                            if (order.status === "ready_for_dispatch") {
                                btnHtml = `<button onclick="assignDriver('${order.receipt_id}')" class="action-btn btn-dispatch">Assign Driver Alex</button>`;
                            } else {
                                if (!transitTrackers[order.receipt_id]) transitTrackers[order.receipt_id] = { mins: 15, miles: 4.2 };
                                else if (transitTrackers[order.receipt_id].mins > 1) { transitTrackers[order.receipt_id].mins -= 0.2; transitTrackers[order.receipt_id].miles -= 0.05; }
                                trackerHtml = `<div class="transit-timer-box"><span>⏱ ETA: ${Math.ceil(transitTrackers[order.receipt_id].mins)} Mins</span><span>📍 DIST: ${Math.max(transitTrackers[order.receipt_id].miles, 0.1).toFixed(2)} Mi</span></div>`;
                                btnHtml = `<button onclick="advanceOrderStatus('${order.receipt_id}', 'completed')" class="action-btn btn-complete">Confirm Handover</button>`;
                            }
                            card.innerHTML = `<strong>${order.receipt_id}</strong><h3 style="margin:5px 0;">${order.client_name}</h3>${trackerHtml}${btnHtml}`;
                            dispatchContainer.appendChild(card);
                        }
                    });
                    document.getElementById('kitchen-count').innerText = `🍳 KITCHEN PREPARATION (${kitchenCount})`;
                }
            } catch (err) { console.error(err); }
        }
        async function advanceOrderStatus(t, s) { await fetch(`/orders/${t}/update-status?new_status=${s}`, { method: 'PATCH' }); fetchSystemData(); }
        async function assignDriver(t) { await fetch(`/dispatch/assign/${t}?driver_name=Alex`, { method: 'POST' }); fetchSystemData(); }
        setInterval(fetchSystemData, 2000); window.onload = fetchSystemData;
    </script>
</body>
</html>
